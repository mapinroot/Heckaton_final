function addAlternative(p,b,target,note,origin,eventId){if(b.result!=='HOLD'||b.visual==='anomaly'||['In transit','Delivered'].includes(b.delivery))throw Error('Only held, undispatched batches without suspected contamination can request an alternative.');if(target===b.route||!state.receivingSites.some(s=>s.id===target))throw Error('Choose a different receiving site.');if(state.alternativeRequests.some(q=>q.projectId===p.id&&q.batchId===b.id&&!['Rejected','Cancelled'].includes(q.status)))throw Error('This batch already has an open alternative request.');const q={id:'ALT-'+Date.now().toString(36).toUpperCase()+'-'+state.alternativeRequests.length,projectId:p.id,batchId:b.id,originalRoute:b.route,targetRoute:target,status:'Pending review',origin,eventId:eventId||null,created:stamp(),note,original:{...b},history:[{message:'Alternative review requested · '+origin,time:stamp()}]};state.alternativeRequests.unshift(q);p.log.unshift({message:q.id+': '+b.id+' alternative review requested at '+routes.find(r=>r.id===target).name,time:stamp()});persist();return q;}
function ingestMachineReading(d){if(!d||typeof d!=='object')throw Error('A JSON reading object is required.');const p=state.projects.find(p=>p.id===d.projectId),r=routes.find(r=>r.id===d.originalRoute);if(!p||!r)throw Error('Project or original route is unknown.');if(typeof d.eventId!=='string'||!d.eventId.trim()||d.eventId.length>80||typeof d.batchId!=='string'||!d.batchId.trim()||d.batchId.length>30||typeof d.machineId!=='string'||!d.machineId.trim()||d.machineId.length>80)throw Error('Provide a unique eventId, batchId and machineId.');if(state.machineEvents.includes(d.eventId))throw Error('This machine event has already been received.');if(p.batches.some(b=>b.id.toLowerCase()===d.batchId.toLowerCase()))throw Error('Batch ID already exists. Import a new batch reading.');if(![d.mass,d.moisture,d.fines].every(x=>typeof x==='number'&&Number.isFinite(x))||d.mass<=0||d.mass>40||d.moisture<0||d.moisture>100||d.fines<0||d.fines>100||!['clear','uncertain','anomaly'].includes(d.visual))throw Error('Check mass (0–40 t), moisture/fines (0–100%) and visual status.');const b={id:d.batchId.trim(),mass:d.mass,moisture:d.moisture,fines:d.fines,visual:d.visual,route:r.id,result:d.visual==='anomaly'?'FAIL':'HOLD',delivery:'Blocked',reason:'Original receiver conditions not met; alternative review requested',time:stamp(),machineId:d.machineId};if(d.visual!=='anomaly'&&conformsCurrent(b,r)&&p.material===specOf(r).material)throw Error('This reading meets the original specification. Use the normal PASS workflow.');if(d.visual!=='anomaly'&&(d.targetRoute===r.id||!state.receivingSites.some(s=>s.id===d.targetRoute)))throw Error('Provide a different receiving site as targetRoute.');p.batches.push(b);state.machineEvents.push(d.eventId);state.machineEvents=state.machineEvents.slice(-1000);if(d.visual==='anomaly'){b.reason='Unexpected material / suspected contamination; quarantine and technical review';p.log.unshift({message:b.id+' machine FAIL: quarantine required; rerouting blocked',time:stamp()});persist();return {batchId:b.id,status:'Quarantine',requestId:null};}const q=addAlternative(p,b,d.targetRoute,'Machine '+d.machineId+': original receiver mismatch. '+(typeof d.note==='string'?d.note.slice(0,1000):''),'Machine reading',d.eventId);return {batchId:b.id,status:q.status,requestId:q.id};}
window.ReGroundMachine=Object.freeze({submitReading:reading=>{const result=ingestMachineReading(reading);render();return result;}});
function machineDialog(){const sample={eventId:'EVT-'+Date.now(),machineId:'RG-FIELD-01',projectId:project().id,batchId:'M-'+Date.now().toString().slice(-6),originalRoute:project().route,targetRoute:project().route==='local'?'alternative':'local',mass:18.4,moisture:22,fines:42,visual:'clear',note:'Moisture outside original receiver limit'};modal(modalHeader('Machine alternative request','Import a field reading. This creates a local request for the alternative receiver to review.')+`<form id="machine-reading-form"><div class="notice">Demo machine ${esc(sample.machineId)} · ${esc(sample.batchId)}<br>Moisture ${sample.moisture}% · Fines ${sample.fines}% · Mass ${sample.mass} t<br>Original: ${esc(routes.find(r=>r.id===sample.originalRoute).name)} → Requested: ${esc(routes.find(r=>r.id===sample.targetRoute).name)}</div><details class="machine-payload"><summary>Machine payload / integration details</summary><label class="field">Machine reading (JSON)<textarea name="reading" rows="13" required spellcheck="false">${esc(JSON.stringify(sample,null,2))}</textarea></label></details><p class="sub">Original conditions are checked again by ReGround. A request never authorises transport. Suspected contamination is quarantined.</p><div id="machine-error" class="form-error" role="alert" tabindex="-1"></div><div class="modal-actions">${button('Cancel','close')}<button class="btn primary" type="submit">Receive demo reading & create request</button></div></form>`);}
function alternativeDialog(batchId){const b=project().batches.find(b=>b.id===batchId);if(!b)return;modal(modalHeader('Request an alternative route',esc(b.id)+' · '+num(b.mass)+' t · '+esc(b.reason))+`<form id="alternative-request-form" data-batch="${esc(b.id)}"><label class="field">Alternative receiving site<select name="target">${state.receivingSites.filter(s=>s.id!==b.route).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></label><label class="field">Reason / supporting reference<textarea name="note" required maxlength="1000" placeholder="Why the original specification was not met, and the evidence available"></textarea></label><div id="alternative-error" class="form-error" role="alert" tabindex="-1"></div><div class="modal-actions">${button('Cancel','close')}<button class="btn primary" type="submit">Create review request</button></div></form>`);}
function alternativeActions(q){const status=qStatus(q);if(['Received','In transit','Quarantined'].includes(status))return pill(status,status==='Quarantined'?'amber':'');if(receiver()){if(['Pending review','Additional test required','Review reopened'].includes(status))return button('Review request','review-alternative','primary',`data-id="${q.id}"`);return pill(status,status==='Rejected'?'amber':'');}if(['Approved','Ready'].includes(status))return button('Recheck for this route','recheck-alternative','primary',`data-id="${q.id}"`);return pill(status,status==='Pending review'||status==='Review reopened'?'amber':'grey');}
function alternativesPage(){const rows=requestRows(),held=receiver()?[]:project().batches.filter(b=>b.result==='HOLD'&&!['In transit','Delivered'].includes(b.delivery)&&!state.alternativeRequests.some(q=>q.projectId===project().id&&q.batchId===b.id&&!['Rejected','Cancelled'].includes(q.status)));return heading('LOADS / ALTERNATIVE ROUTES','Alternative requests','A held batch stays at source until the new receiver reviews it and a fresh check passes.',!receiver()?button('Import machine reading','machine-reading','primary'):'')+`<div class="notice">Machine request → receiver review → recheck → eligible PASS → dispatch. The main project route stays unchanged.</div>${!receiver()&&held.length?`<section class="panel mt"><div class="section-title"><h2>Held batches needing a route</h2></div>${held.map(b=>`<div class="hub-task"><div class="task-copy"><strong>${esc(b.id)} · ${num(b.mass)} t ${pill('HOLD','amber')}</strong><p>${esc(b.reason)}</p></div>${button('Request alternative','request-alternative','',`data-id="${esc(b.id)}"`)}</div>`).join('')}</section>`:''}${!receiver()&&project().batches.some(b=>b.result==='FAIL')?`<section class="panel mt"><h2>Quarantine / technical review</h2>${project().batches.filter(b=>b.result==='FAIL').map(b=>`<p class="sub"><strong>${esc(b.id)}</strong> · ${num(b.mass)} t · ${esc(b.reason)}. Alternative transport is blocked.</p>`).join('')}</section>`:''}<div class="stack mt">${rows.length?rows.map(q=>{const p=requestProject(q),b=requestBatch(q),s=requestSite(q),old=routes.find(r=>r.id===q.originalRoute),status=qStatus(q);return `<article class="panel alt-card"><div class="section-title"><div><div class="eyebrow">${esc(q.id)} · ${esc(q.origin)}</div><h2>${esc(q.batchId)} · ${num(q.original.mass)} t</h2></div>${pill(status,['Pending review','Additional test required','Review reopened'].includes(status)?'amber':status==='Rejected'?'grey':'')}</div><div class="alt-path"><span><small>ORIGINAL RECEIVER</small><strong>${esc(old.name)}</strong><span>HOLD · original conditions not met</span></span><span class="alt-arrow">→</span><span><small>REQUESTED RECEIVER</small><strong>${esc(s.name)}</strong><span>${s.moistureMin}–${s.moistureMax}% moisture · ${s.finesMin}–${s.finesMax}% fines</span></span></div><p class="sub">${esc(p.name)} · Original reading: moisture ${num(q.original.moisture)}%, fines ${num(q.original.fines)}% · ${esc(q.created)}</p><p class="sub">${esc(q.note)}</p>${q.decisionNote?`<div class="notice">Receiver: ${esc(q.decisionNote)}</div>`:''}${status==='Review reopened'?'<div class="notice">Receiving criteria changed. A new receiver decision is required before release.</div>':''}<div class="alt-footer">${alternativeActions(q)}<span class="sub">${b.delivery==='In transit'||b.delivery==='Delivered'?esc(b.delivery):status==='Ready'?'Fresh PASS recorded · use Supplier dispatch queue':'Held at source · no transport permission'}</span></div><details><summary>Request history & original record</summary>${q.history.map(h=>`<p class="sub">${esc(h.time)} · ${esc(h.message)}</p>`).join('')}<p class="sub">Original route ${esc(old.name)} · original QA ${esc(q.original.result)} · batch ${esc(q.original.id)}. This record is preserved after rechecking.</p></details></article>`;}).join(''):'<section class="panel empty"><h3>No alternative requests for this '+(receiver()?'receiving site':'project')+'.</h3><p>Requests appear here when a machine reading or held batch needs another destination.</p></section>'}</div>`;}
function reviewAlternative(id){const q=state.alternativeRequests.find(q=>q.id===id);if(!q||!receiver()||q.targetRoute!==site().id)return;const p=requestProject(q),b=requestBatch(q),r=routes.find(r=>r.id===q.targetRoute);modal(modalHeader('Review '+q.batchId+' for '+site().name,'Batch-specific request · '+num(b.mass)+' t · '+esc(p.material))+`<form id="alternative-decision-form" data-request="${q.id}"><p class="sub">Original moisture: ${num(q.original.moisture)}%; fines: ${num(q.original.fines)}%. Current receiving limits: ${site().moistureMin}–${site().moistureMax}% moisture, ${site().finesMin}–${site().finesMax}% fines.</p><div class="notice">${batchFit(p,b,r)?'Material, batch mass and source dates fit this site.':'Material, remaining capacity or source dates do not fit this site. Approval is blocked.'} Approval is conditional; fresh batch measurements are required before release.</div><label class="field">Decision<select name="decision"><option>Additional test required</option><option>Approve for recheck</option><option>Reject</option></select></label><label class="check-label"><input type="checkbox" name="evidence"> I have reviewed the source evidence and suitability for this batch and intended use.</label><label class="field">Decision reason / evidence reference<textarea name="note" required maxlength="1000" placeholder="Review reference, reviewer and conditions or required tests"></textarea></label><div id="decision-error" class="form-error" role="alert" tabindex="-1"></div><div class="modal-actions">${button('Cancel','close')}<button class="btn primary" type="submit">Record decision</button></div></form>`);}
function recheckAlternative(id){const q=state.alternativeRequests.find(q=>q.id===id);if(!q||receiver()||q.projectId!==project().id||!qValid(q)||!['Approved','Ready'].includes(q.status))return;const b=requestBatch(q),s=requestSite(q);if(['In transit','Delivered'].includes(b.delivery)){toast('Dispatched loads cannot be rechecked or rerouted.');return;}modal(modalHeader('Recheck '+b.id+' for '+s.name,'Fresh measurements are recorded separately from the original failed-condition reading.')+`<form id="alternative-recheck-form" data-request="${q.id}"><div class="form-grid"><label class="field">Fresh moisture (%)<input name="moisture" type="number" min="0" max="100" step="0.1" required value="${b.moisture}"><small>${s.moistureMin}–${s.moistureMax}% required</small></label><label class="field">Fresh fines (%)<input name="fines" type="number" min="0" max="100" step="0.1" required value="${b.fines}"><small>${s.finesMin}–${s.finesMax}% required</small></label></div><label class="field">Visual inspection<select name="visual"><option value="clear">No unexpected material observed</option><option value="uncertain">Inspection incomplete</option><option value="anomaly">Unexpected material / suspected contamination</option></select></label><label class="field">Retest / machine record reference<input name="reference" required maxlength="160"></label><div id="recheck-error" class="form-error" role="alert" tabindex="-1"></div><div class="modal-actions">${button('Cancel','close')}<button class="btn primary" type="submit">Record recheck</button></div></form>`);}
const previousTools=subTools;subTools=function(){let html=previousTools();if(hubTab==='loads')html=html.replace('</div>',`<button data-action="hub-go" data-id="alternatives" class="${page==='alternatives'?'selected':''}">Alternative requests${requestRows().filter(q=>['Pending review','Additional test required','Review reopened'].includes(qStatus(q))).length?' · '+requestRows().filter(q=>['Pending review','Additional test required','Review reopened'].includes(qStatus(q))).length:''}</button></div>`);return html;};
const previousV2Page=renderPage;renderPage=function(){if(page==='alternatives')return alternativesPage();return previousV2Page();};
// hubContent calls the V3-captured dispatcher, so handle the new section directly.
const previousContent=hubContent;hubContent=function(){if(page!=='alternatives')return previousContent();hubTab='loads';return `<div class="hub-title"><div><div class="eyebrow">SHARED PROJECT · ${esc(currentHub().id)}</div><h1>${esc(currentHub().name)}</h1></div></div>${projectTabs()}${subTools()}${alternativesPage().replace(/<h1>/g,'<h2 class="task-heading">').replace(/<\/h1>/g,'</h2>')}`;};
const previousVerification=verificationPage;verificationPage=function(){return `<section class="panel alt-entry"><div><strong>Original receiver conditions not met?</strong><p class="sub">Send a held batch for alternative receiver review, or import a machine reading.</p></div><div class="button-row">${hubAction('Alternative requests','alternatives')}${button('Import machine reading','machine-reading')}</div></section>`+previousVerification();};
const previousTasks=nextTasks;nextTasks=function(){const tasks=previousTasks(),qs=requestRows().filter(q=>receiver()?['Pending review','Additional test required','Review reopened'].includes(qStatus(q)):['Pending review','Approved','Ready','Review reopened','Additional test required'].includes(qStatus(q)));if(qs.length)tasks.unshift({title:receiver()?`Review ${qs.length} alternative request(s)`:`${qs.length} alternative request(s) need attention`,note:receiver()?'Check the held batch against your site criteria.':'Check receiver decisions and arrange the required retest.',owner:receiver()?'Receiver':qs.every(q=>['Pending review','Review reopened'].includes(qStatus(q)))?'Receiver':'Supplier',target:'alternatives',ic:'route'});if(!receiver()&&!qs.length&&project().batches.some(b=>b.result==='HOLD'&&!b.alternativeRequestId))tasks.unshift({title:'A held batch needs a route review',note:'Review the original conditions or request an alternative receiving site.',owner:'Supplier',target:'alternatives',ic:'route'});return tasks;};
const previousRender=render;render=function(){previousRender();document.title='ReGround V4 — Machine alternative requests';$('.version-mark').textContent='V4';$('.footer-note').firstElementChild.textContent='ReGround V4 · Illustrative Auckland project';};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(!['machine-reading','request-alternative','review-alternative','recheck-alternative'].includes(a))return;e.stopImmediatePropagation();if(a==='machine-reading'&&!receiver())machineDialog();if(a==='request-alternative'&&!receiver())alternativeDialog(b.dataset.id);if(a==='review-alternative')reviewAlternative(b.dataset.id);if(a==='recheck-alternative')recheckAlternative(b.dataset.id);},true);
document.addEventListener('submit',e=>{const f=e.target,id=f.id;if(!['machine-reading-form','alternative-request-form','alternative-decision-form','alternative-recheck-form'].includes(id))return;e.preventDefault();e.stopImmediatePropagation();const d=Object.fromEntries(new FormData(f));try{if(id==='machine-reading-form'){if(receiver())throw Error('Machine imports belong to the supplier workspace.');const result=ingestMachineReading(JSON.parse(d.reading));$('#dialog').close();navigate('alternatives');toast(result.requestId?'Machine request received. Alternative receiver review is pending.':'Machine FAIL recorded. Quarantine required; alternative routing is blocked.');return;}if(id==='alternative-request-form'){if(receiver())throw Error('Supplier action required.');if(!d.note.trim())throw Error('Add the reason and supporting reference.');addAlternative(project(),project().batches.find(b=>b.id===f.dataset.batch),d.target,d.note.trim(),'Supplier request');}if(id==='alternative-decision-form'){const q=state.alternativeRequests.find(q=>q.id===f.dataset.request);if(!q||!receiver()||q.targetRoute!==site().id||!['Pending review','Additional test required','Review reopened'].includes(qStatus(q)))throw Error('This request is not awaiting a decision at your site.');if(!d.note.trim())throw Error('Record a decision reason and evidence reference.');if(d.decision==='Approve for recheck'){if(!d.evidence||!batchFit(requestProject(q),requestBatch(q),routes.find(r=>r.id===q.targetRoute)))throw Error('Approval requires reviewed evidence and compatible material, dates and remaining capacity.');q.status='Approved';q.approvedCriteria=criteriaSnapshot(site());q.evidenceReviewed=true;}else q.status=d.decision==='Reject'?'Rejected':'Additional test required';q.decisionNote=d.note.trim();q.history.unshift({message:q.status+' · '+q.decisionNote,time:stamp()});requestProject(q).log.unshift({message:q.id+' receiver decision: '+q.status,time:stamp()});}if(id==='alternative-recheck-form'){const q=state.alternativeRequests.find(q=>q.id===f.dataset.request),b=requestBatch(q),r=routes.find(r=>r.id===q.targetRoute);if(receiver()||!qValid(q)||!['Approved','Ready'].includes(q.status)||['In transit','Delivered'].includes(b.delivery))throw Error('Current receiver approval is required for an undispatched load.');if(!d.reference.trim())throw Error('Add a retest record reference.');const test={...b,moisture:+d.moisture,fines:+d.fines,visual:d.visual};let result=d.visual==='anomaly'?'FAIL':conformsCurrent(test,r)&&batchFit(requestProject(q),test,r)?'PASS':'HOLD';q.rechecks ||= [];q.rechecks.unshift({moisture:test.moisture,fines:test.fines,visual:test.visual,reference:d.reference.trim(),result,time:stamp()});Object.assign(b,{moisture:test.moisture,fines:test.fines,visual:test.visual,result,delivery:result==='PASS'?'Awaiting dispatch':'Blocked',time:stamp(),alternativeRequestId:q.id,reason:result==='PASS'?'Fresh PASS for approved alternative route':'Alternative retest '+result});if(result==='PASS'){b.route=q.targetRoute;q.status='Ready';}else{b.route=q.originalRoute;q.status=result==='FAIL'?'Quarantined':'Approved';}q.history.unshift({message:'Fresh '+result+' · '+d.reference.trim(),time:stamp()});requestProject(q).log.unshift({message:q.id+' recheck: '+result,time:stamp()});}persist();$('#dialog').close();navigate('alternatives');toast('Alternative request updated.');}catch(err){inlineError(id==='machine-reading-form'?'machine-error':id==='alternative-request-form'?'alternative-error':id==='alternative-decision-form'?'decision-error':'recheck-error',err.message);}},true);
persist();render();
</script></body></html>
